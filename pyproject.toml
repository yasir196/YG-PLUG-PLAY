[project]
name = "yg-plug-play"
version = "0.0.1"
description = "Plugin-first local content production platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "cryptography>=46,<47",
    "fastapi>=0.118,<1",
    "jinja2>=3.1,<4",
    "jsonschema>=4.25,<5",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.37,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "types-jsonschema>=4.25,<5",
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.13,<1",
]

[project.scripts]
yg = "tools.yg.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["core*", "tools*", "dashboard*"]

[tool.setuptools.package-data]
dashboard = ["templates/*.html"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".data", "data", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = "(^|/)(\\.venv|\\.data|data|runtime)/"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
